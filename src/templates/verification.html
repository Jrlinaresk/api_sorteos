<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Código de verificación</title>
  <style>
    body { font-family: sans-serif; background-color: #132A48; margin: 0; padding: 0; padding: 16px; }
    .container {
      text-align: center; max-width: 600px; margin: 0px auto; background-color: #FDFAF0; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { background-color: #FDFAF0; color: #132A48; padding: 20px; text-align: center;font-size: 0.5rem;}
    .header h1 {
  margin-top: -16px;
    margin-bottom: 0px;

}
    .logo { max-height: 256px; }
    .content {    
       margin-top: -32px;
    margin-bottom: 0px;
    margin-left: auto;
    margin-right: auto;
    text-align: center; padding: 16px; color: #f97878; }
.code {
    margin-top: 32px;
    margin-bottom: 0px;
    margin-left: auto;
    margin-right: auto;
      border-radius: 16px;
  display: block;
  width: fit-content;
  padding: 16px 32px;
  background-color: #e1b97931;
  font-size: 2.5rem;              
  letter-spacing: 1px;
  font-weight: bold;              
  color: #132A48;                
}
    .footer {    
      margin-top: -16px;
    margin-bottom: 0px;
    margin-left: auto;
    margin-right: auto;
     background-color: #FDFAF0; padding: 15px 20px; font-size: 0.9rem; color: #777777; text-align: center; }
.btn {
      margin-top: 16px;
    margin-bottom: 0px;
    margin-left: auto;
    margin-right: auto;
  display: block;
  padding: 12px 24px;
  background-color: #7FAA4A;
  color: #FDFAF0;
  text-decoration: none;
  border-radius: 16px;
  font-size: 1rem;
  font-weight: bold;
  letter-spacing: 1px;
  padding-left: 16px;
  padding-right: 16px;
  text-align: center;
}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
            <!-- Logo de la aplicación -->
      <img src="cid:logo" alt="Logo" class="logo" />
      <h1>Código de verificación</h1>
      <span class="code">{{code}}</span>
    </div>
    <div class="content">
      <p>Si no lo solicitaste, simplemente ignora este correo.</p>
      <a href="https://tu-app.com/login" class="btn">Confirmar</a>
    </div>
    <div class="footer">
      <p>© 2025 Sorteos Habana. Todos los derechos reservados.</p>
    </div>
  </div>
</body>
</html>
