services:
  # Aplicación NestJS
  api-sorteos:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: api-sorteos-app
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=production
      - PORT=8080
      - MONGODB_URI=mongodb://develop:Dbabnsmdb2024@mongodb:27017/api_rest_sorteos_nestjs_mongodb?authSource=admin
    depends_on:
      - mongodb
    networks:
      - sorteos-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Base de datos MongoDB
  mongodb:
    image: mongo:7.0
    container_name: mongodb-api-rest-sorteos
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: develop
      MONGO_INITDB_ROOT_PASSWORD: Dbabnsmdb2024
      MONGO_INITDB_DATABASE: api_rest_sorteos_nestjs_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
      - ./mongodb-init:/docker-entrypoint-initdb.d
    networks:
      - sorteos-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx como proxy reverso (opcional)
  nginx:
    image: nginx:alpine
    container_name: nginx-api-sorteos
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-sorteos
    networks:
      - sorteos-network

volumes:
  mongo-data:
    driver: local

networks:
  sorteos-network:
    driver: bridge
