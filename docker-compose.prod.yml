services:
  # Aplicación NestJS - Producción
  api-sorteos:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: api-sorteos-prod
    restart: unless-stopped
    ports:
      - '8017:8080'
    env_file:
      - .env.server
    environment:
      - NODE_ENV=production
      - PORT=8080
      - MONGODB_URI=mongodb://develop:Dbabnsmdb2024@mongodb:27017/api_rest_sorteos_nestjs_mongodb?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - sorteos-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Base de datos MongoDB - Producción
  mongodb:
    image: mongo:7.0
    container_name: mongodb-prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: develop
      MONGO_INITDB_ROOT_PASSWORD: Dbabnsmdb2024
      MONGO_INITDB_DATABASE: api_rest_sorteos_nestjs_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo-data-prod:/data/db
      - ./mongodb-init:/docker-entrypoint-initdb.d
      - ./mongodb-config:/etc/mongo
    networks:
      - sorteos-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  mongo-data-prod:
    driver: local

networks:
  sorteos-network:
    driver: bridge
