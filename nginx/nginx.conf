worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format api '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                   'request_time=$request_time correlation="$http_x_correlation_id" '
                   'agent="$http_user_agent" forwarded="$http_x_forwarded_for"';
    access_log /dev/stdout api;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_body_timeout 30s;
    client_header_timeout 15s;
    client_max_body_size 260m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript image/svg+xml text/css text/plain;

    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    upstream api_sorteos {
        server api-sorteos:8080;
        keepalive 32;
    }

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;

    server {
        listen 8080 default_server;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_hide_header X-Powered-By;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

        location = /api/v1/health {
            access_log off;
            proxy_pass http://api_sorteos;
        }

        location ~ ^/api/v1/auth/(login|register|refresh|password/reset/(request|confirm))/?$ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api_sorteos;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_request_buffering off;
            proxy_pass http://api_sorteos;
        }

        location / {
            proxy_pass http://api_sorteos;
        }
    }
}
